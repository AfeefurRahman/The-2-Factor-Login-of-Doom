<!DOCTYPE html>
<html>
<head>
    <title>CyberCorp Secure Login</title>
    <style>
        /*
           NOTE TO SELF: I forgot to set the password. Oops.
           (Hackers: nothing to see here.)
        */
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            border: 2px solid #0f0;
            padding: 2rem;
            background: #111;
        }
        input {
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 5px;
            margin-bottom: 10px;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>CyberCorp Secure Login</h1>
        <p>2-Factor Authentication: Enabled*</p>
        <form id="loginForm">
            <input type="text" placeholder="Username" id="username"><br>
            <input type="password" placeholder="Password" id="password"><br>
            <button type="submit">Login</button>
        </form>
        <p id="message"></p>
    </div>

    <script>
    // Dave never gave this a value...
    let superSecretPassword;

    // Flag is stored encoded so it isn't readable in view-source
    const encodedFlag = "Q1RGe0RhdmVfSXNfTm90X0FfUmVhbF9EZXZlbG9wZXJ9";

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const msg = document.getElementById('message');

        if (user === 'admin') {
            // Dave's "safety" check: an empty input becomes undefined,
            // which matches the undefined password
            if ((pass || undefined) === superSecretPassword) {
                msg.textContent = "ACCESS GRANTED. Welcome, Admin. Dave is proud of you.";
                msg.style.color = "gold";
                alert("FLAG: " + atob(encodedFlag));
            } else {
                msg.textContent = "ACCESS DENIED. Dave is crying.";
                msg.style.color = "red";
            }
        } else {
            msg.textContent = "That's not the admin username, buddy.";
            msg.style.color = "yellow";
        }
    });
    </script>
</body>
</html>
